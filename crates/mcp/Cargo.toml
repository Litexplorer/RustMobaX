[package]
name = "rustmobax-mcp"
description = "MCP server layer for RustMobaX: tool surface over rustmobax-core"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true

[dependencies]
rustmobax-core = { path = "../core" }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio.workspace = true
async-trait = "0.1"
axum = "0.8.9"
schemars = "1"
rmcp = { version = "=3.11.0", features = [
  "server",
  "transport-streamable-http-server",
  "elicitation",
] }
